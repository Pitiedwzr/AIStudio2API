services:
  aistudio2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aistudio2api:local
    restart: unless-stopped
    ports:
      - "${AISTUDIO2API_PORT:-2048}:2048"
    environment:
      LISTEN_ADDR: 0.0.0.0:2048
      AISTUDIO_AUTH_STATES: /app/auth
      PROXY_API_KEY: ${PROXY_API_KEY:-}
      PROXY: ${PROXY:-}
      INIT_TIMEOUT: ${INIT_TIMEOUT:-2m}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-5m}
      WARM_WORKER_LIMIT: ${WARM_WORKER_LIMIT:-5}
      MAX_ACTIVE_WORKERS: ${MAX_ACTIVE_WORKERS:-10}
      WARM_STARTUP_CONCURRENCY: ${WARM_STARTUP_CONCURRENCY:-2}
      PER_ACCOUNT_CONCURRENCY: ${PER_ACCOUNT_CONCURRENCY:-2}
      ROUTING_STRATEGY: ${ROUTING_STRATEGY:-round-robin}
      TEMPORARY_CHAT: ${TEMPORARY_CHAT:-false}
    volumes:
      - aistudio2api-auth:/app/auth
      - aistudio2api-runtime:/app/runtime

volumes:
  aistudio2api-auth:
  aistudio2api-runtime:
